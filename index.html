<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Clothing Classifier</title>
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow.js and Teachable Machine libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body class="dark-theme">
    <!-- Decorative Background Blobs -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="page-wrapper">
        <main class="main-content">
            <!-- Premium Ad Banner -->
            <div class="ad-banner-card">
                <div class="ad-content">
                    <div class="ad-tag">SPONSORED</div>
                    <div class="ad-info">
                        <h2>나만의 AI 비즈니스, 지금 시작하세요</h2>
                        <p>복잡한 코딩 없이 아이디어만으로 앱을 만드는 법. 프로덕트 빌더 코스에서 확인하세요.</p>
                        <a href="#" class="ad-cta">자세히 보기 <span>→</span></a>
                    </div>
                    <div class="ad-visual">
                        <div class="ad-blob"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
                <h1>AI 의류 분류기</h1>
                <p class="subtitle">속옷, 수영복, 일상복을 실시간으로 구분합니다.</p>
                
                <div class="ai-container">
                    <div class="webcam-frame">
                        <div id="webcam-container"></div>
                        <img id="image-preview" style="display:none;">
                        <div id="placeholder" class="webcam-placeholder">
                            <span class="icon">📷</span>
                            <p>카메라를 시작하거나 사진을 업로드하세요.</p>
                        </div>
                    </div>
                    
                    <div class="ai-controls">
                        <button id="start-btn" type="button">🎥 실시간 분류 시작</button>
                        <label for="image-upload" class="upload-label">
                            📁 사진 파일 업로드
                            <input type="file" id="image-upload" accept="image/*" style="display:none;">
                        </label>
                    </div>
                    
                    <div id="label-container" class="results-grid">
                        <!-- Labels will be injected here dynamically -->
                    </div>
                </div>

                <hr class="separator">

                <!-- Lotto Section Restored -->
                <div class="lotto-section">
                    <h2>🎰 행운의 로또 번호 생성기</h2>
                    <p class="subtitle">1부터 45까지의 숫자 중 6개를 무작위로 추첨합니다.</p>
                    <div class="numbers-container">
                        <!-- Lotto numbers will appear here -->
                    </div>
                    <button id="generate-btn">번호 생성하기</button>
                </div>

                <hr class="separator">

                <div class="contact-section">
                    <h2>피드백 및 문의</h2>
                    <form action="https://formspree.io/f/xdalddzk" method="POST" id="contact-form">
                        <div class="form-group">
                            <label for="email">이메일</label>
                            <input type="email" name="email" id="email" required placeholder="name@email.com">
                        </div>
                        <div class="form-group">
                            <label for="message">메시지</label>
                            <textarea name="message" id="message" required placeholder="의견을 남겨주세요..."></textarea>
                        </div>
                        <button type="submit" id="submit-btn">보내기</button>
                    </form>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <div class="comments-section">
                    <h2>커뮤니티</h2>
                    <div id="disqus_thread"></div>
                    <script>
                        (function() {
                        var d = document, s = d.createElement('script');
                        s.src = 'https://productbuilder-gwwnslrqum.disqus.com/embed.js';
                        s.setAttribute('data-timestamp', +new Date());
                        (d.head || d.body).appendChild(s);
                        })();
                    </script>
                </div>
            </div>
        </aside>
    </div>
    <script src="main.js"></script>
</body>
</html>
