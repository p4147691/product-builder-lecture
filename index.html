<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme"> <!-- Default to dark-theme -->
    <div class="page-wrapper">
        <main class="main-content">
            <div class="card">
                <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
                <h1>Lotto Number Generator</h1>
                <div class="numbers-container"></div>
                <button id="generate-btn">Generate Numbers</button>

                <hr class="separator">

                <div class="contact-section">
                    <h2>Feedback & Questions</h2>
                    <form action="https://formspree.io/f/xdalddzk" method="POST" id="contact-form">
                        <div class="form-group">
                            <label for="email">Your Email</label>
                            <input type="email" name="email" id="email" required placeholder="name@email.com">
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea name="message" id="message" required placeholder="Let us know what you think..."></textarea>
                        </div>
                        <button type="submit" id="submit-btn">Send Message</button>
                    </form>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <div class="comments-section">
                    <h2>Comments</h2>
                    <div id="disqus_thread"></div>
                    <script>
                        (function() {
                        var d = document, s = d.createElement('script');
                        s.src = 'https://productbuilder-gwwnslrqum.disqus.com/embed.js';
                        s.setAttribute('data-timestamp', +new Date());
                        (d.head || d.body).appendChild(s);
                        })();
                    </script>
                    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
                </div>
            </div>
        </aside>
    </div>
    <script src="main.js"></script>
</body>
</html>
